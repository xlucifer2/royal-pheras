<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Pheras — Client Links</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14120E;--surf1:#1B1812;--surf2:#221E16;
  --cream:#F1EADA;--cream-64:rgba(241,234,218,.64);--cream-40:rgba(241,234,218,.4);
  --gold:#C9A45C;--gold-hi:#E5C98C;--hair:rgba(241,234,218,.16);
  --ok:#9DB38A;--err:#E2907B;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--cream);font-family:Inter,sans-serif;font-size:15px;line-height:1.6;padding:48px 24px 80px}
h1{font-family:Gloock,serif;font-size:2rem;margin-bottom:.4rem}
.sub{color:var(--cream-64);font-size:.9rem;margin-bottom:3rem}
.mono{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.18em;font-size:.7rem;color:var(--gold)}
.wrap{max-width:860px;margin:0 auto}

/* cards */
.card{background:var(--surf1);border:1px solid var(--hair);border-radius:6px;padding:22px 24px;margin-bottom:1.2rem;display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.monogram{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;background:var(--gold);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:1.2rem;font-weight:600;flex-shrink:0}
.info{flex:1;min-width:0}
.info .name{font-family:Gloock,serif;font-size:1.1rem;margin-bottom:.3rem}
.info .url{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--cream-64);word-break:break-all;cursor:pointer}
.info .url:hover{color:var(--gold-hi)}
.actions{display:flex;gap:.6rem;flex-shrink:0;flex-wrap:wrap}
.btn{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;border-radius:999px;border:1px solid var(--hair);background:transparent;color:var(--cream);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;transition:border-color .2s,color .2s}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.primary:hover{background:var(--gold-hi)}
.btn.copied{background:var(--ok);border-color:var(--ok);color:var(--ink)}

/* add client form */
.add-panel{background:var(--surf2);border:1px solid var(--hair);border-radius:6px;padding:28px 24px;margin-top:2.4rem}
.add-panel h2{font-family:Gloock,serif;font-size:1.3rem;margin-bottom:1.4rem}
.row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.row input{flex:1;min-width:200px;background:var(--surf1);border:1px solid var(--hair);color:var(--cream);padding:10px 14px;border-radius:4px;font-family:Inter,sans-serif;font-size:.9rem}
.row input:focus{outline:2px solid var(--gold);outline-offset:1px}
.row input::placeholder{color:var(--cream-40)}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--surf2);border:1px solid var(--gold);padding:12px 20px;border-radius:4px;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:600px){.card{flex-direction:column;align-items:flex-start}.actions{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <p class="mono" style="margin-bottom:1rem">Royal Pheras</p>
  <h1>Client Links</h1>
  <p class="sub">Every link below opens the site personalised for that client. Click <strong>Copy link</strong> and send it directly.</p>

  <div id="clientList"></div>

  <!-- Add new client -->
  <div class="add-panel">
    <h2>Generate a new link</h2>
    <div class="row">
      <input id="newBiz"  placeholder="Business name  e.g. ABC Events" />
      <input id="newLogo" placeholder="Logo URL (optional)" />
    </div>
    <button class="btn primary" onclick="addClient()">Generate &amp; preview</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Base URL — change this to your deployed domain before sharing ──────────
const BASE = location.origin + location.pathname.replace('clients.html','index.html');

// ── Preset clients ─────────────────────────────────────────────────────────
const CLIENTS = [
  { name: 'Brothers Events Planner' },
  { name: 'Vishal Wedding & Event Planner' },
  { name: 'JAIN SAHAB PAGDI / Shubh Event Vala' },
  { name: 'Rozi Tent House And Decoration' },
  { name: 'Dj Brother Events' },
  { name: 'Saini Events Planner' },
];

function buildURL(name, logo) {
  const p = new URLSearchParams();
  p.set('biz', name);
  if (logo && logo.trim()) p.set('logo', logo.trim());
  return BASE + '?' + p.toString();
}

function monogramLetter(name) {
  return name.trim()[0].toUpperCase();
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy link'; btn.classList.remove('copied'); }, 2000);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function renderCard(client, idx) {
  const url = buildURL(client.name, client.logo || '');
  const letter = monogramLetter(client.name);
  const id = 'card-' + idx;
  return `
  <div class="card" id="${id}">
    <div class="monogram" title="Monogram preview">${letter}</div>
    <div class="info">
      <div class="name">${client.name}</div>
      <div class="url" title="Click to open" onclick="window.open('${url}','_blank')">${url}</div>
    </div>
    <div class="actions">
      <button class="btn" onclick="copyLink(this,'${encodeURIComponent(url)}')">Copy link</button>
      <a class="btn primary" href="${url}" target="_blank" rel="noopener">Preview ↗</a>
    </div>
  </div>`;
}

function copyLink(btn, encodedUrl) {
  copyText(decodeURIComponent(encodedUrl), btn);
}

function renderAll() {
  document.getElementById('clientList').innerHTML = CLIENTS.map((c, i) => renderCard(c, i)).join('');
}

function addClient() {
  const name = document.getElementById('newBiz').value.trim();
  const logo = document.getElementById('newLogo').value.trim();
  if (!name) { showToast('Please enter a business name.'); return; }
  CLIENTS.push({ name, logo });
  renderAll();
  document.getElementById('newBiz').value = '';
  document.getElementById('newLogo').value = '';
  showToast(`Link generated for "${name}"`);
  document.getElementById('card-' + (CLIENTS.length - 1)).scrollIntoView({ behavior: 'smooth' });
}

renderAll();
</script>
</body>
</html>
